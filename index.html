function goTop(){window.scrollTo({top:0,behavior:'smooth'})}

function pickCat(i){cat=(i===''?'':D.cats[i]);render();goG()}
function card(it){
  var p=num(it.price),o=num(it.old),d=(o>p&&p>0)?Math.round((1-p/o)*100):0,im=(it.imgs&&it.imgs[0])||it.img||'';
  return '<div class="card"><div class="img" onclick="view(\''+it.id+'\')">'+(im?'<img alt="'+qa(nm(it))+'" src="'+im+'" style="width:100%;height:100%;object-fit:cover;border-radius:16px">':'🛠️')+'<span class="lbl">'+tr('av')+'</span><button class="heart" onclick="event.stopPropagation();fav(\''+it.id+'\',this)">'+(F[it.id]?'♥':'♡')+'</button></div><div class="body" onclick="view(\''+it.id+'\')"><h3>'+esc(nm(it))+'</h3>'+(it.price?'<div class="pri">'+esc(it.price)+'</div>':'')+((d||it.old)?'<div class="dis">'+(d?'<b>'+d+'%</b>':'')+'<s>'+esc(it.old)+'</s></div>':'')+(it.cat?'<span class="spec">'+esc(cn(it.cat))+'</span>':'')+'<span class="exp"><em>'+tr('order')+'</em></span>'+(admin?'<div class="row" onclick="event.stopPropagation()"><button class="btn s o" onclick="edit(\''+it.id+'\')">تعديل</button><button class="btn s r" onclick="del(\''+it.id+'\')">حذف</button></div>':'')+'</div></div>';
}
function sec(t,l,g){return '<div class="st2"><h2>'+esc(t)+'</h2></div><div class="'+(g?'gr':'sc')+'">'+l.map(card).join('')+'</div>'}
function grid(){
  var s=q.trim().toLowerCase(),g=document.getElementById('g');
  var list=D.items.filter(function(x){return(!cat||x.cat===cat)&&(!s||(x.name+' '+(x.name_en||'')+' '+(x.desc||'')+' '+(x.desc_en||'')).toLowerCase().indexOf(s)>-1)});
  if(!list.length){g.innerHTML='<div class="empty">'+tr('none')+'</div>';return}
  var h='';
  if(s||cat)h=sec(cat?cn(cat):tr('res'),list,true);
  else{D.cats.forEach(function(c){var l=list.filter(function(x){return x.cat===c});if(l.length)h+=sec(cn(c),l)});
    var r=list.filter(function(x){return D.cats.indexOf(x.cat)<0});if(r.length)h+=sec(tr('other'),r)}
  g.innerHTML=h;
}

function gstep(n){var g=document.getElementById('gal');g.scrollBy({left:n*g.clientWidth,behavior:'smooth'})}
function openM(html){M.innerHTML='<div class="sheet"><button class="xb" onclick="closeM()">✕</button>'+html+'</div>';M.className='on'}
function closeM(){M.className='';M.innerHTML=''}
M.addEventListener('click',function(e){if(e.target===M)closeM()});
var cur=null,curImgs=[];
function shrink(f,mx,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var z=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*z);c.height=Math.round(im.height*z);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.72))};im.src=r.result};r.readAsDataURL(f)}
function thumbs(){var t=document.getElementById('th');if(!t)return;t.innerHTML=curImgs.map(function(u,i){return '<span class="tn"><img src="'+u+'"><button onclick="rmImg('+i+')">×</button></span>'}).join('')}
function rmImg(i){curImgs.splice(i,1);thumbs()}
function pick(inp){Array.prototype.slice.call(inp.files).forEach(function(f){shrink(f,800,function(u){if(curImgs.length<8){curImgs.push(u);thumbs()}})});inp.value=''}
function edit(id){
  cur=id||null;var it=D.items.filter(function(x){return x.id===id})[0]||{name:'',price:'',old:'',desc:''};curImgs=(it.imgs||(it.img?[it.img]:[])).slice();
  openM('<h3>'+(id?'تعديل معدة':'إضافة معدة')+'</h3><label>الاسم</label><input id="fn" value="'+qa(it.name)+'"><label>Name (English)</label><input id="fne" value="'+qa(it.name_en||'')+'"><label>التصنيف</label><select id="fc">'+catOpts(it.cat||cat)+'</select><label>السعر</label><input id="fp" value="'+qa(it.price)+'"><label>السعر قبل الخصم (اختياري)</label><input id="fo" value="'+qa(it.old)+'"><label>التعريف والوصف (يظهر تحت الصور)</label><textarea id="fd" rows="4">'+esc(it.desc)+'</textarea><label>Description (English)</label><textarea id="fde" rows="3">'+esc(it.desc_en||'')+'</textarea><label>الصور (اختر أكتر من صورة)</label><input type="file" accept="image/*" multiple onchange="pick(this)"><div id="th" class="ths"></div><div class="row" style="margin-top:14px"><button class="btn" onclick="saveItem()">حفظ</button><button class="btn o" onclick="closeM()">إلغاء</button></div>');
  thumbs();
}
function saveItem(){
  var n=document.getElementById('fn').value.trim();if(!n){alert('اكتب اسم المعدة');return}
  var o={id:cur||'i'+Date.now(),name:n,name_en:document.getElementById('fne').value.trim(),cat:document.getElementById('fc').value,price:document.getElementById('fp').value.trim(),old:document.getElementById('fo').value.trim(),desc:document.getElementById('fd').value.trim(),desc_en:document.getElementById('fde').value.trim(),imgs:curImgs.slice(),img:curImgs[0]||''};
  if(cur){D.items=D.items.map(function(x){return x.id===cur?o:x})}else D.items.unshift(o);
  persist();
}
var sidx=-1,simg='';
function slidesM(){openM('<h3>البانر المتحرك</h3>'+D.slides.map(function(x,i){return '<div class="ci"><img src="'+qa(x.img)+'" style="width:64px;height:44px;object-fit:contain;background:#fff;border-radius:6px"><b>'+esc(x.t||'—')+'</b><button class="btn s o" onclick="slideF('+i+')">تعديل</button><button class="btn s r" onclick="delSlide('+i+')">حذف</button></div>'}).join('')+'<div class="row" style="margin-top:12px"><button class="btn" onclick="slideF(-1)">+ إضافة صورة</button><button class="btn o" onclick="closeM()">إغلاق</button></div>')}
function slideF(i){sidx=i;var x=i>=0?D.slides[i]:{t:'',s:'',te:'',se:'',img:''};simg=x.img;openM('<h3>'+(i>=0?'تعديل':'إضافة')+' صورة متحركة</h3><label>العنوان</label><input id="sl1" value="'+qa(x.t)+'"><label>الوصف</label><input id="sl2" value="'+qa(x.s)+'"><label>Title (English)</label><input id="sl3" value="'+qa(x.te||'')+'"><label>Subtitle (English)</label><input id="sl4" value="'+qa(x.se||'')+'"><label>الصورة</label><input type="file" accept="image/*" onchange="slPick(this)"><img id="slp" class="prev" '+(simg?'src="'+qa(simg)+'"':'style="display:none"')+'><div class="row" style="margin-top:14px"><button class="btn" onclick="saveSlide()">حفظ</button><button class="btn o" onclick="slidesM()">رجوع</button></div>')}
function slPick(inp){var f=inp.files[0];if(!f)return;shrink(f,1000,function(u){simg=u;var p=document.getElementById('slp');p.src=u;p.style.display='block'})}
function saveSlide(){if(!simg){alert('اختر صورة');return}var o={t:document.getElementById('sl1').value.trim(),s:document.getElementById('sl2').value.trim(),te:document.getElementById('sl3').value.trim(),se:document.getElementById('sl4').value.trim(),img:simg};if(sidx>=0)D.slides[sidx]=o;else D.slides.push(o);persist()}
function delSlide(i){if(confirm('حذف هذه الصورة؟')){D.slides.splice(i,1);persist()}}
function del(id){if(confirm('حذف هذه المعدة؟')){D.items=D.items.filter(function(x){return x.id!==id});persist()}}
function cats(){
  openM('<h3>التصنيفات</h3><label>اكتب كل تصنيف في سطر (للإنجليزي: عربي | English)</label><textarea id="sc" rows="6">'+esc(D.cats.join('\n'))+'</textarea><div class="row" style="margin-top:14px"><button class="btn" onclick="saveCats()">حفظ</button><button class="btn o" onclick="closeM()">إلغاء</button></div>');
}
function saveCats(){D.cats=document.getElementById('sc').value.split('\n').map(function(s){return s.trim()}).filter(Boolean);cat='';persist()}
function settings(){
  var ph=plist().map(function(p){return (p.l?p.l+' | ':'')+p.n}).join('\n'),lk=(D.links||[]).map(function(l){return l.t+' | '+l.l+' | '+l.u}).join('\n');
  openM('<h3>بيانات الموقع</h3><label>اسم المعرض</label><input id="sn" value="'+qa(D.name)+'"><label>أرقام التليفون (رقم في كل سطر، أو: الاسم | الرقم)</label><textarea id="sp" rows="3">'+esc(ph)+'</textarea><label>صفحاتي وروابطي (كل رابط في سطر: النوع | الاسم | الرابط)</label><textarea id="sk" rows="5" placeholder="facebook | صفحتنا | https://facebook.com/...">'+esc(lk)+'</textarea><small>الأنواع: whatsapp, facebook, instagram, tiktok, youtube, x, telegram, website, email, location</small><div class="row" style="margin-top:14px"><button class="btn" onclick="saveSet()">حفظ</button><button class="btn o" onclick="closeM()">إلغاء</button></div>');
}
function saveSet(){
  D.name=document.getElementById('sn').value.trim()||D.name;
  var P=[];document.getElementById('sp').value.split('\n').forEach(function(l){l=l.trim();if(!l)return;var a=l.split('|').map(function(x){return x.trim()}),n=a.pop();if(n)P.push({l:a.join(' '),n:n})});
  if(P.length){D.phones=P;D.phone=P[0].n}
  var K=[];document.getElementById('sk').value.split('\n').forEach(function(l){var a=l.split('|').map(function(x){return x.trim()});if(a.length<3)return;var t=a[0].toLowerCase(),raw=a.slice(2).join('|');if(t==='email'&&raw.indexOf('@')>0&&!/^mailto:/i.test(raw))raw='mailto:'+raw;var u=safeUrl(raw);if(u)K.push({t:t,l:a[1],u:u})});
  D.links=K;persist();
}
function buildHtml(){
  var c=document.documentElement.cloneNode(true);
  c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
  c.querySelector('#app').innerHTML='';c.querySelector('#m').innerHTML='';c.querySelector('#m').className='';var spl=c.querySelector('#sp');if(spl)spl.remove();c.querySelector('#pg').innerHTML='';c.querySelector('#pg').className='';
  c.querySelector('title').textContent=D.name;c.setAttribute('dir','rtl');c.setAttribute('lang','ar');
  return '<!DOCTYPE html>\n'+c.outerHTML;
}
async function persist(){
  if(busy)return;
  if(!art){
    var h=buildHtml(),b=new Blob([h],{type:'text/html'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='index.html';document.body.appendChild(a);a.click();a.remove();
    render();openM('<h3>تم تنزيل الملف ✅</h3><p>ارفع ملف <b>index.html</b> الجديد على الاستضافة مكان القديم عشان التعديلات تظهر للعملاء.</p><div class="row"><button class="btn" onclick="closeM()">تمام</button></div>');
    return;
  }
  busy=true;try{sessionStorage.setItem('saved','1')}catch(e){}M.className='on';M.innerHTML='<div class="sheet"><p style="text-align:center">جارٍ الحفظ…</p></div>';
  try{await art.publish(buildHtml())}
  catch(e){busy=false;try{sessionStorage.removeItem('saved')}catch(x){}closeM();alert('تعذر الحفظ، حاول مرة أخرى.')}
}
if(location.hash==='#admin')admin=true;
render();
try{showSplash()}catch(e){}
(async function(){
  try{
    var u=await claude.use('user'),a=await claude.use('artifact');
    var ok=u&&((await u.isOwner())||(await u.canEdit()));
    if(ok&&a){admin=true;art=a;render()}
  }catch(e){}
})();
</script>
